# MSVC CRT _setjmp / longjmp (used by libjpeg error handling). Recompiled as plain code,
# longjmp clobbers non-volatiles and returns normally (run-05 crash: r31=0 in 0x83845470).
setjmp_address = 0x8397B4A0  # saves f14-f31 @0, r13-r31 @152, v64-v127 @320
longjmp_address = 0x8397B180 # restores same buffer; unwind hook @312

# Function boundaries the analyzer missed. Each entry is checked in Ghidra
# (notes\logs\dump-8375A.txt) and recorded in notes\findings.md.
[entrypoint.functions]
# this-adjustor thunks reached only via thunk-to-thunk tail branches
0x837803F0 = { size = 0x8 } # addi r3,r3,0x10 ; b 0x8375E380  (from 0x8375B0F4)
0x837817B8 = { size = 0x8 } # addi r3,r3,0x4  ; b 0x8377B8E0 (1.0 0x8375A460; from 0x8378164C) # was: b 0x837551E8  (from 0x8375B114)

# Guest XAPI fiber functions replaced by host implementations (SDK kernel/crt/threading.cpp).
# SwitchToFiber's guest body (0x83819200) swaps r1 + all non-volatiles and can't be
# recompiled statically. Evidence: notes\logs\dump-8380E2.txt, dump-8380E6.txt.
[entrypoint.rexcrt]
ConvertThreadToFiber = 0x83833B00 # sets ERROR_ALREADY_FIBER (0x500); stores fiber at KTHREAD+0x164
ConvertFiberToThread = 0x83833B90 # sets ERROR_ALREADY_THREAD (0x501); clears KTHREAD+0x164
CreateFiber          = 0x83833BE0 # (dwStackSize, lpStartAddress, lpParameter); 0x4000 min stack
DeleteFiber          = 0x83833CC0 # self-delete -> ExitThread(1)
SwitchToFiber        = 0x83833D20 # b 0x83819200 (context save/restore)

# Audio engine per-hardware-thread barrier: the guest spin barrier deadlocks under host
# preemption (audio cuts out). Replaced by a generation-counted host barrier in
# src\ng2_hooks.cpp. Evidence: notes\findings.md #18, #20.
[[entrypoint.midasm_hook]]
address = 0x83774818
name = "Ng2AudioBarrier"
registers = ["r3", "r4"]
return = true

# Options > "Recomp Settings" (renamed Copyright Information, see src\ng2_hooks.cpp data
# patches). Its right-hand pane is the copyright pane (vtable 0x82286E48); slot 39
# 0x836B0B58 draws the copyright text every frame while the item is highlighted. We skip
# it and draw the RECOMP SETTINGS pane ourselves (notes\findings.md #21).
[[entrypoint.midasm_hook]]
address = 0x836D6070
name = "Ng2RecompPaneDraw"
registers = ["r3"]
return = true

# D3D present (calls VdSwap once per game frame): counts frames for the FPS counter.
[[entrypoint.midasm_hook]]
address = 0x8376A9F8
name = "Ng2OnPresent"
